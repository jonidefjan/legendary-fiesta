<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Preview do cenário 3D</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #181425;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        max-height: 100vh;
        height: 100vh;
        image-rendering: pixelated;
        object-fit: contain;
      }
      #info {
        position: fixed;
        left: 8px;
        top: 8px;
        color: #ead4aa;
        font: 12px monospace;
        text-shadow: 1px 1px #000;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "../vendor/three/build/three.module.js",
          "three/addons/": "../vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info"></div>
    <script type="module">
      import * as THREE from "three";
      import { CAMERA, WORLD } from "../src/three/world.js";
      import { sharedUniforms } from "../src/three/materials.js";
      import { buildEnvironment } from "../src/three/environment.js";

      // ?res=240 (padrão) renderiza em baixa resolução; ?res=0 em resolução cheia
      const params = new URLSearchParams(location.search);
      const res = Number(params.get("res") ?? 240);
      const aspect = Number(params.get("aspect")) || 16 / 9; // proporção fixa 16:9
      const h = res > 0 ? res : 720;
      const w = Math.round(h * aspect);

      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setPixelRatio(1);
      renderer.setSize(w, h, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe4a672);

      const vh = CAMERA.viewHeight;
      const camera = new THREE.OrthographicCamera((-vh * aspect) / 2, (vh * aspect) / 2, vh / 2, -vh / 2, 0.1, 200);
      const pitch = THREE.MathUtils.degToRad(CAMERA.pitchDeg);
      const t = CAMERA.target;
      camera.position.set(t.x, t.y + Math.sin(pitch) * 60, t.z + Math.cos(pitch) * 60);
      camera.lookAt(t.x, t.y, t.z);
      camera.updateMatrixWorld();

      // sol baixo e quente, vindo da esquerda/frente
      const sun = new THREE.DirectionalLight(0xffc27a, 3.2);
      sun.position.set(-18, 14, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      const sc = sun.shadow.camera;
      sc.left = -34;
      sc.right = 34;
      sc.top = 30;
      sc.bottom = -30;
      sc.near = 1;
      sc.far = 90;
      sun.shadow.bias = -0.0006;
      sun.shadow.normalBias = 0.04;
      scene.add(sun);
      scene.add(new THREE.HemisphereLight(0xc0cbdc, 0x733e39, 1.1));

      const env = buildEnvironment(scene);

      // retângulo da água (marcador provisório)
      if (env.waterRect) {
        const r = env.waterRect;
        const plane = new THREE.Mesh(
          new THREE.PlaneGeometry(r.maxX - r.minX, r.maxZ - r.minZ),
          new THREE.MeshBasicMaterial({ color: 0x0099db, transparent: true, opacity: 0.6 }),
        );
        plane.rotation.x = -Math.PI / 2;
        plane.position.set((r.minX + r.maxX) / 2, r.y, (r.minZ + r.maxZ) / 2);
        scene.add(plane);
      }

      const info = document.getElementById("info");
      const clock = new THREE.Clock();
      let frames = 0;
      function frame() {
        const time = clock.getElapsedTime();
        sharedUniforms.uTime.value = time;
        env.update(time);
        renderer.render(scene, camera);
        if (++frames % 30 === 0) {
          const i = renderer.info.render;
          info.textContent = `draw calls: ${i.calls}  tris: ${i.triangles}  ${w}x${h}`;
        }
        requestAnimationFrame(frame);
      }
      frame();
      window.__env = env;
    </script>
  </body>
</html>
